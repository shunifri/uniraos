version: '3.8'

services:
  # Qdrant - 使用已推送到华为云的镜像
  qdrant:
    image: swr.cn-north-4.myhuaweicloud.com/kavin/qdrant:v1.9.0
    container_name: raos-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - raos-backend
    restart: unless-stopped

  # MySQL - 如果本地有缓存则使用，否则需要手动拉取
  mysql-primary:
    image: mysql:8.0
    container_name: raos-mysql-primary
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: raos
      MYSQL_USER: raos
      MYSQL_PASSWORD: raospassword
    volumes:
      - mysql_primary_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - raos-backend
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    container_name: raos-redis
    ports:
      - "6379:6379"
    networks:
      - raos-backend
    restart: unless-stopped

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: raos-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: raos
      RABBITMQ_DEFAULT_PASS: raospassword
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - raos-backend
    restart: unless-stopped

volumes:
  mysql_primary_data:
  qdrant_storage:

networks:
  raos-backend:
    driver: bridge
