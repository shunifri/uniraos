global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # RAOS Application
  - job_name: 'raos-app'
    static_configs:
      - targets: ['raos-backend:3000']
    metrics_path: /metrics
    scrape_interval: 10s
