groups:
  - name: raos-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RAOS error rate is high"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "RAOS P99 latency is high"
          description: "P99 latency is {{ $value }}s over the last 5 minutes"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RAOS instance is down"
          description: "Instance {{ $labels.instance }} has been down for more than 1 minute"

      - alert: HighMemoryUsage
        expr: nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAOS heap usage is high"
          description: "Heap usage is {{ $value | humanizePercentage }}"

      - alert: HealthCheckDegraded
        expr: |
          (
            sum by (instance) (up{job="raos-backend"}) == 0
          ) or (
            sum by (instance) (up{job="raos-backend"}) > 0
            and
            sum by (instance) (up{job="raos-backend"}) < 1
          )
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RAOS health check degraded"
          description: "Health check is reporting degraded status"

      # Q3 W3 Item #8: WAL 定期 compact 自动化 (cron + 监控)
      # 触发条件: WAL 文件 > 200MB 持续 5 分钟.
      # 应对: 跑 `npm run wal:compact -- --apply` 归档已完成 entry.
      # 阈值 200MB = 2x 100MB truncate 兜底 (file-wal-store.ts:85), 留 buffer.
      # 镜像: src/monitoring/alerts.ts WAL_SIZE_HIGH (TS 形状, 单测覆盖).
      - alert: WAL_SIZE_HIGH
        expr: wal_active_size_bytes > 209715200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAOS WAL file size is high"
          description: "Active WAL file is {{ $value | humanize }}B (>200MB) for 5+ minutes. Run `npm run wal:compact -- --apply` to archive completed entries. If unchecked, P1-20 truncate fallback at 100MB will start dropping history."
