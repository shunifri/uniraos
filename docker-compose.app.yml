version: '3.8'

services:
  # RAOS Node 1
  raos-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raos-node-1
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_PRIMARY_HOST=mysql-primary
      - MYSQL_PRIMARY_PORT=3306
      - MYSQL_REPLICA_HOSTS=mysql-replica
      - MYSQL_USER=${MYSQL_USER:-raos}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-raospassword}
      - MYSQL_DATABASE=raos
      - REDIS_HOSTS=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-raos}:${RABBITMQ_PASS:-raospassword}@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-in-production}
      - LOG_LEVEL=info
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - raos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # RAOS Node 2
  raos-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raos-node-2
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_PRIMARY_HOST=mysql-primary
      - MYSQL_PRIMARY_PORT=3306
      - MYSQL_REPLICA_HOSTS=mysql-replica
      - MYSQL_USER=${MYSQL_USER:-raos}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-raospassword}
      - MYSQL_DATABASE=raos
      - REDIS_HOSTS=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-raos}:${RABBITMQ_PASS:-raospassword}@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-change-in-production}
      - LOG_LEVEL=info
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - raos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: raos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - raos-node-1
      - raos-node-2
    networks:
      - raos-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  raos-network:
    external: true
