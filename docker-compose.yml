version: '3.8'

# =============================================================================
# RAOS 完整 Docker 部署配置
# 包含：基础设施 + 后端 API + 前端 Web
# =============================================================================

services:
  # ===========================================================================
  # 基础设施层
  # ===========================================================================
  
  # MySQL 主库
  mysql-primary:
    image: mysql:8.0
    container_name: raos-mysql-primary
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: raos
      MYSQL_USER: ${MYSQL_USER:-raos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-raospassword}
    volumes:
      - mysql_primary_data:/var/lib/mysql
      - ./docker/mysql/primary.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --innodb-buffer-pool-size=1G
      --max-connections=200
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - raos-backend
    restart: unless-stopped

  # MySQL 从库（可选）
  mysql-replica:
    image: mysql:8.0
    container_name: raos-mysql-replica
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ./docker/mysql/replica.cnf:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "3307:3306"
    command: >
      --server-id=2
      --read-only=1
      --innodb-buffer-pool-size=1G
    depends_on:
      mysql-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raos-backend
    restart: unless-stopped
    profiles:
      - replica

  # Redis
  redis:
    image: redis:7-alpine
    container_name: raos-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - raos-backend
    restart: unless-stopped

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: raos-qdrant
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raos-backend
    restart: unless-stopped

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: raos-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-raos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-raospassword}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raos-backend
    restart: unless-stopped

  # MinIO 对象存储
  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: raos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-raos}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-raospassword}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raos-backend
    restart: unless-stopped

  # ===========================================================================
  # 后端服务层
  # ===========================================================================
  
  # RAOS 后端 API 服务
  raos-backend:
    image: swr.cn-north-4.myhuaweicloud.com/kavin/raos-backend:test
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: production
    container_name: raos-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      # 数据库配置
      MYSQL_PRIMARY_HOST: mysql-primary
      MYSQL_PRIMARY_PORT: 3306
      MYSQL_REPLICA_HOSTS: mysql-replica:3306
      MYSQL_USER: ${MYSQL_USER:-raos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-raospassword}
      MYSQL_DATABASE: raos
      MYSQL_CONN_LIMIT: 20
      # Redis 配置
      REDIS_HOSTS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_KEY_PREFIX: "raos:"
      # Qdrant 配置
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      # RabbitMQ 配置
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-raos}:${RABBITMQ_PASS:-raospassword}@rabbitmq:5672
      # MinIO 配置
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_USER: ${MINIO_USER:-raos}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-raospassword}
      MINIO_BUCKET: raos-files
      # JWT 密钥
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      # 日志
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - raos-backend
      - raos-frontend
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # 队列消费者服务（可独立扩展）
  # 队列消费者服务
  raos-workers:
    # 华为云 SWR 镜像: swr.cn-north-4.myhuaweicloud.com/kavin/raos-backend:test
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: production
    container_name: raos-workers
    command: npm run worker:start
    environment:
      NODE_ENV: production
      # 数据库配置（与 backend 相同）
      MYSQL_PRIMARY_HOST: mysql-primary
      MYSQL_PRIMARY_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-raos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-raospassword}
      MYSQL_DATABASE: raos
      REDIS_HOSTS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-raos}:${RABBITMQ_PASS:-raospassword}@rabbitmq:5672
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USER: ${MINIO_USER:-raos}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-raospassword}
      LOG_LEVEL: info
    depends_on:
      - mysql-primary
      - redis
      - qdrant
      - rabbitmq
    networks:
      - raos-backend
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ===========================================================================
  # 前端服务层
  # ===========================================================================
  
  # RAOS 前端 Web 服务
  # 前端 Web 服务
  raos-frontend:
    # 华为云 SWR 镜像: swr.cn-north-4.myhuaweicloud.com/kavin/raos-frontend:test
    image: swr.cn-north-4.myhuaweicloud.com/kavin/raos-frontend:test
    build:
      context: ./web
      dockerfile: ../docker/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_URL: ws://localhost:3000
    container_name: raos-frontend
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/frontend/ssl:/etc/nginx/ssl:ro
    depends_on:
      raos-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - raos-frontend
    restart: unless-stopped

  # ===========================================================================
  # 监控层（可选）
  # ===========================================================================
  
  # Prometheus
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: raos-prometheus
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - raos-backend
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana
  grafana:
    image: grafana/grafana:10.4.1
    container_name: raos-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - raos-backend
    restart: unless-stopped
    profiles:
      - monitoring

# =============================================================================
# 数据卷
# =============================================================================
volumes:
  mysql_primary_data:
    driver: local
  mysql_replica_data:
    driver: local
  redis_data:
    driver: local
  qdrant_storage:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# =============================================================================
# 网络
# =============================================================================
networks:
  raos-backend:
    driver: bridge
    internal: false
  raos-frontend:
    driver: bridge
    internal: false
